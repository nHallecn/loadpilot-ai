name: LoadPilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Check demo script syntax
        run: |
          node --check apps/api/scripts/demo-preflight.mjs
          node --check apps/api/scripts/demo-experiments.mjs
          node --check apps/api/scripts/controlled-investigation.mjs
          node --check apps/api/scripts/ai-hypothesis-demo.mjs
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build dashboard
        run: pnpm --filter @loadpilot/web build
