name: LoadPilot CI

on:
  pull_request:
    branches: [main, feat/ai-hypothesis-followups]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Check demo script syntax
        run: |
          node --check apps/api/scripts/demo-preflight.mjs
          node --check apps/api/scripts/demo-experiments.mjs
          node --check apps/api/scripts/controlled-investigation.mjs
          node --check apps/api/scripts/ai-hypothesis-demo.mjs
          node --check apps/api/scripts/sample-owned-app.mjs
      - name: Validate action-first repair script syntax
        run: |
          node --check apps/api/scripts/repair-agent.mjs
          node --check apps/api/scripts/repair-harness.mjs
          node --check apps/api/examples/repair-lab/catalog.mjs
          node --check apps/api/examples/repair-lab/optimized.example.mjs
          node --check apps/api/examples/repair-lab/incorrect.example.mjs
      - name: Pull isolated verification image
        run: docker pull node:22-alpine
      - name: Action-first repair checks (offline candidates, no Meta credentials)
        run: |
          node apps/api/scripts/repair-agent.mjs --candidate-file apps/api/examples/repair-lab/optimized.example.mjs --approve-sandbox --report-out /tmp/repair-positive.json
          node apps/api/scripts/repair-agent.mjs --candidate-file apps/api/examples/repair-lab/incorrect.example.mjs --approve-sandbox --report-out /tmp/repair-negative.json --expect-reject
          node --input-type=module -e "import {readFileSync,existsSync} from 'node:fs'; const good=JSON.parse(readFileSync('/tmp/repair-positive.json'));const bad=JSON.parse(readFileSync('/tmp/repair-negative.json'));if(good.verdict.status!=='accepted'||bad.verdict.status!=='rejected'||!existsSync('/tmp/repair-positive.patch')||!good.verdict.samples||good.verdict.samples.length!==3)process.exit(1);"
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build dashboard
        run: pnpm --filter @loadpilot/web build


  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build production dashboard for browser verification
        run: pnpm --filter @loadpilot/web build
      - name: Install isolated browser test dependency
        run: npm install --prefix tests/browser --no-package-lock --no-audit --no-fund
      - name: Install headless Chromium and system dependencies
        run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run actual dashboard and bounded API integration in Chromium
        run: node tests/browser/e2e.mjs
      - name: Upload browser evidence and logs (no real user secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadpilot-browser-ci
          path: tests/browser/artifacts/
          if-no-files-found: ignore
          retention-days: 7
